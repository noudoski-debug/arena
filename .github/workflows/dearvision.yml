name: DearVision internal
on:
  workflow_dispatch:
  push:
    paths: ['DearVisionRoot/**', 'dump 1.14.11949.zip', '.github/workflows/dearvision.yml']
  pull_request:
    paths: ['DearVisionRoot/**', 'dump 1.14.11949.zip', '.github/workflows/dearvision.yml']
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: DearVisionRoot/tools/test.sh
  android:
    needs: host-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select installed Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk" && test -d "$sdk/ndk"
          ndk="$(find "$sdk/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$ndk/ndk-build"
          echo "NDK_PATH=$ndk" >> "$GITHUB_ENV"
      - run: DearVisionRoot/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: DearVisionRoot-arm64-untested-on-device
          if-no-files-found: error
          path: |
            DearVisionRoot/build/libs/arm64-v8a/libDear.so
            DearVisionRoot/build/libs/arm64-v8a/dear-loader
            DearVisionRoot/run-root.sh
            DearVisionRoot/README_RU.md
