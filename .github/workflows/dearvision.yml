name: EncoreDLC3 internal
on:
  workflow_dispatch:
  push:
    paths: ['EncoreDLC3_Internal/**', 'dump 1.14.11949.zip', 'EncoreDLC3_ESP_10FPS_source_fix.zip', '.github/workflows/dearvision.yml']
  pull_request:
    paths: ['EncoreDLC3_Internal/**', 'dump 1.14.11949.zip', 'EncoreDLC3_ESP_10FPS_source_fix.zip', '.github/workflows/dearvision.yml']
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: EncoreDLC3_Internal/tools/test.sh
  android:
    permissions:
      contents: write
    needs: host-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select installed Android NDK
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk" && test -d "$sdk/ndk"
          ndk="$(find "$sdk/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$ndk/ndk-build"
          echo "NDK_PATH=$ndk" >> "$GITHUB_ENV"
      - run: EncoreDLC3_Internal/build.sh
      - name: Package and inspect ARM64 binaries
        shell: bash
        run: |
          set -euo pipefail
          out=EncoreDLC3_Internal/build/libs/arm64-v8a
          readelf -h "$out/libEncore.so" | grep 'Machine:.*AArch64'
          readelf -h "$out/encore-loader" | grep 'Machine:.*AArch64'
          package=EncoreDLC3_Internal/build/package
          mkdir -p "$package"
          cp "$out/libEncore.so" "$out/encore-loader" EncoreDLC3_Internal/run-root.sh "$package/"
          cp EncoreDLC3_Internal/README_RU.md EncoreDLC3_Internal/MODULES_RU.md EncoreDLC3_Internal/ENCORE_ESP_FIX_RU.md EncoreDLC3_Internal/THIRD_PARTY.md EncoreDLC3_Internal/STARTUP_RU.md EncoreDLC3_Internal/SOURCE_MAP.json "$package/"
          cp -r EncoreDLC3_Internal/licenses "$package/"
          printf 'Commit: %s\nNDK: %s\nDevice tested: NO\n' "$GITHUB_SHA" "$NDK_PATH" > "$package/BUILD.txt"
          (cd "$package" && sha256sum libEncore.so encore-loader > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: EncoreDLC3_Internal-arm64-untested-on-device
          if-no-files-found: error
          path: EncoreDLC3_Internal/build/package/

      - name: Export buildable sources with dump
        shell: bash
        run: |
          mkdir -p EncoreDLC3_Internal/build/sources
          git archive --format=zip --output=EncoreDLC3_Internal/build/sources/EncoreDLC3_Internal-source.zip HEAD \
            EncoreDLC3_Internal 'dump 1.14.11949.zip' 'EncoreDLC3_ESP_10FPS_source_fix.zip' .github/workflows/dearvision.yml .gitignore README.md
      - uses: actions/upload-artifact@v4
        with:
          name: EncoreDLC3_Internal-source-with-dump
          if-no-files-found: error
          path: EncoreDLC3_Internal/build/sources/EncoreDLC3_Internal-source.zip

      # Publish on the session branch only; never upload binaries from PRs/forks.
      - name: Publish downloadable internal preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/arena/16ea671a-arena'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          release=EncoreDLC3_Internal/build/release
          mkdir -p "$release"
          cp EncoreDLC3_Internal/build/sources/EncoreDLC3_Internal-source.zip "$release/EncoreDLC3_ESP_10FPS_INTERNAL_source.zip"
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          package=Path('EncoreDLC3_Internal/build/package')
          output=Path('EncoreDLC3_Internal/build/release/EncoreDLC3_ESP_10FPS_INTERNAL_arm64.zip')
          with zipfile.ZipFile(output,'w',zipfile.ZIP_DEFLATED) as archive:
              for path in sorted(package.rglob('*')):
                  if path.is_file():
                      archive.write(path,path.relative_to(package))
          PY
          (cd "$release" && sha256sum *.zip > DOWNLOAD_SHA256SUMS)
          tag="encore-internal-${GITHUB_SHA:0:12}"
          cat > "$release/RELEASE_NOTES.md" <<EOF
          ## EncoreDLC3 ESP 10FPS → Internal ARM64 (preview, incomplete)

          Исходник: EncoreDLC3_ESP_10FPS_source_fix.zip, SHA-256 записан в SOURCE_MAP.json.
          Commit: $GITHUB_SHA
          Build and host tests: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          **Сборка NDK прошла. Проверки на телефоне не было. Не все функции реализованы.**
          Это не релиз «всё работает» и не подтверждённый рабочий Silent Aim.

          - arm64.zip: libEncore.so, encore-loader, run-root.sh, инструкции, лицензии и SHA256SUMS.
          - source.zip: internal-исходники, исходный external ZIP для сверки, dump.cs в исходном архиве дампа, тесты и CI.
          - Цель: com.catsbit.oxidesurvivalisland / 1.14.11949 / arm64-v8a / GLES3.
          - Startup diagnostics v1: constructor/worker/EGL/Dobby stages in game-private files/encoredlc/startup.log and logcat.
          - Independent input/game workers; Dobby installation is serialized. Not a confirmed fix for the missing menu.
          - ESP snapshots, обычный Aim со сглаживанием, физический Visible Check, раздельные Death Check.
          - Silent Ray — эксперимент: настоящий shot callsite и серверные попадания не подтверждены.
          - Death Check использует runtime Health; семантика обфусцированного поля требует device-проверки.
          - Armor/Ammo bars, Wallshot/Infinity Ammo, Bunny Hop/Strafer/Fast Knife/Air Jump/Invisible,
            Buy Anywhere/Infinity Buy, World/Grenade backend и автоматические hit/kill hooks не реализованы.
          - Chams — исходный DrawList renderer, не shader chams; FreeCam — визуальная камера.
          - Root loader экспериментальный. Vulkan, SELinux bypass и hot-unload не поддерживаются.

          Полные ограничения: MODULES_RU.md и ENCORE_ESP_FIX_RU.md внутри архивов.
          EOF
          gh release create "$tag" \
            "$release/EncoreDLC3_ESP_10FPS_INTERNAL_arm64.zip" \
            "$release/EncoreDLC3_ESP_10FPS_INTERNAL_source.zip" \
            "$release/DOWNLOAD_SHA256SUMS" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title 'EncoreDLC3 Internal ARM64 — preview (не все функции)' \
            --notes-file "$release/RELEASE_NOTES.md"
